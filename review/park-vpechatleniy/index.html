<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive"><meta name="theme-color" content="#0d0f0f">
<meta name="referrer" content="no-referrer"><title>Парк впечатлений — ФАЗА.</title>
<link rel="stylesheet" href="./review.css?v=3"><link rel="icon" href="/favicon.svg"><script defer src="./review.js?v=5"></script></head>
<body><header><div class="header-inner"><a class="brand" href="https://fazafilms.ru/" aria-label="Студия ФАЗА">ФАЗА<span>.</span></a><nav aria-label="Разделы страницы"><a href="#film">Монтаж</a><a href="#animatic">Аниматик</a><a href="#scenes">Сцены</a></nav></div></header>
<main><div class="intro"><p class="eyebrow">Национальный центр «Россия»</p><h1>Парк впечатлений<span>.</span></h1></div>
<section id="film" aria-label="Единый монтаж"></section><section id="animatic" aria-label="Полный аниматик"></section>
<section id="new-shots" aria-label="Новые фрагменты для согласования" hidden></section><section id="scenes" aria-label="Сцены в порядке фильма"></section><p id="notice" role="status">Загружаем видео…</p></main>
<footer><a class="brand" href="https://fazafilms.ru/">ФАЗА<span>.</span></a><a href="#film">К началу ↑</a></footer>
<template id="feedback"><details class="feedback"><summary>Оставить замечание <span aria-hidden="true">＋</span></summary><form>
<div class="form-head"><div class="position">Кадр <strong class="clock"></strong></div><button type="button" class="capture">Привязать к текущему кадру</button></div>
<label>Ваше имя <span class="muted">· необязательно</span><input class="author" maxlength="70" autocomplete="name"></label>
<label>Комментарий<textarea class="note" maxlength="2000" rows="3" placeholder="Что изменить в этом кадре?"></textarea></label>
<div class="audio-tools"><button type="button" class="record">Записать голос</button><label class="file-label">Выбрать аудиофайл<input type="file" class="file" accept="audio/*,.m4a,.mp3,.wav,.ogg,.webm"></label><span class="timer" role="timer"></span></div>
<div class="voice-preview" hidden><audio class="voice" controls preload="metadata"></audio><button type="button" class="discard">Убрать запись</button></div>
<div class="send-row"><button type="submit" class="send">Отправить замечание</button><span class="status" role="status" aria-live="polite"></span></div>
</form></details></template>
</body></html>
