<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Городецкая роза · мастерская росписи</title>
<style>
:root{color-scheme:light;--ink:#362d28;--soft:#6b5b50;--line:#cbb69c;--paper:#faf3e6;--accent:#702c36}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 Arial,sans-serif}main{max-width:1150px;margin:auto;padding:clamp(12px,3vw,32px)}.kicker{font-size:12px;letter-spacing:.04em;color:#765e38}h1{margin:4px 0 8px;font:normal clamp(30px,4vw,48px)/1.07 Georgia,serif}p{margin:0}.intro{color:var(--soft);font-size:14px;margin-bottom:12px}.stage{position:relative;isolation:isolate;overflow:hidden;background:#29342f;border:1px solid #665244;border-radius:12px}.stage canvas{display:block;width:100%;height:clamp(222px,34vw,395px)}button{font:600 14px Arial,sans-serif;min-height:44px;border:1px solid var(--line);border-radius:7px;color:var(--ink);background:#fff9ed;cursor:pointer;padding:9px 12px}button:hover{filter:brightness(.96)}button:disabled{cursor:default}button:focus-visible{outline:3px solid #165d71;outline-offset:3px}.spot{display:grid;place-items:center;position:absolute;transform:translate(-50%,-50%);background:transparent;border:2px dashed #fff9dc;border-radius:50%;color:white;padding:0;min-width:44px;min-height:44px;width:48px;height:48px;text-shadow:0 1px 3px #261c11;box-shadow:0 0 0 1px #70583c80}.spot span{border-radius:50%;font:600 13px Arial,sans-serif;display:grid;place-items:center;background:#3b3327ab;width:22px;height:22px}.spot:-moz-focusring,.spot:focus-visible{outline-color:#fff9d9}.spot.done{border-color:transparent;box-shadow:none;opacity:0;pointer-events:none}.spot:hover:not(:disabled){background:#fff5d126}.spot:disabled{visibility:hidden}.caption{position:absolute;bottom:8px;left:10px;font-size:12px;color:#fff6db;background:#222a23ce;padding:3px 7px;border-radius:4px}.controls{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-top:12px;flex-wrap:wrap}.palette{display:flex;gap:6px;flex-wrap:wrap}.palette button{display:flex;align-items:center;gap:6px}.palette button::before{content:'';width:18px;height:18px;background:var(--c);border-radius:50%;box-shadow:inset 1px 2px 4px #fffcf147,inset -1px -2px 3px #271f2720}.palette button[aria-pressed=true]{border:2px solid var(--accent);padding:8px 11px;background:#f3e6d6}.tools{display:flex;gap:7px}.tools .sample{background:var(--accent);color:#fff6eb;border-color:var(--accent)}.group-label{font-weight:bold;font-size:13px;display:block;margin:0 0 5px}.status{margin-top:10px;color:var(--soft);min-height:23px;font-size:14px}.counts{font-size:12px;color:var(--soft);margin-left:10px;font-weight:normal}@media(max-width:620px){main{padding:12px}.stage canvas{height:222px}.controls{gap:8px}.tools{flex:1}.tools button{flex:1}.palette button{padding:8px;font-size:13px}.palette button[aria-pressed=true]{padding:7px}.palette{gap:4px}.spot{width:44px;height:44px}.status{margin-top:7px}.intro{font-size:13px}.group-label{margin-bottom:4px}}
.spot{border:1.5px dashed #fff2b9;background:#8a633034;box-shadow:0 0 0 1px #70583c55}.spot span{background:#302519cb}.caption{left:14px;bottom:12px;padding:4px 9px}.tools button,.spot{touch-action:manipulation}@media(max-width:620px){.stage canvas{height:clamp(143px,46vw,254px)}} </style></head><body><main>
<span class="kicker">Мастерская · Городецкая роспись</span><h1>Городецкая роза</h1>
<p class="intro">Запомните три цветка на образце. Выберите краску и коснитесь места на деревянном блюде.</p>
<div class="stage" id="stage"><canvas id="art" aria-label="Деревянное расписное блюдо с тремя цветочными медальонами"></canvas>
<button class="spot" aria-label="Расписать левый цветок"><span>1</span></button>
<button class="spot" aria-label="Расписать центральный цветок"><span>2</span></button>
<button class="spot" aria-label="Расписать правый цветок"><span>3</span></button>
<span class="caption" id="caption">Образец росписи</span></div>
<div class="controls"><div><span class="group-label" id="pal-label">Краска <span class="counts" id="count">Готово 0 из 3</span></span>
<div class="palette" role="group" aria-labelledby="pal-label">
<button style="--c:#325e92" data-paint="0" aria-pressed="false">Синяя</button>
<button style="--c:#b34238" data-paint="1" aria-pressed="true">Киноварь</button>
<button style="--c:#d67894" data-paint="2" aria-pressed="false">Розовая</button></div></div>
<div class="tools"><button class="sample" id="sample">Начать роспись</button><button id="reset">Сначала</button></div></div>
<p class="status" role="status" id="status">Слева синий цветок, в центре киноварь, справа розовый. Когда запомните, начните роспись.</p>
</main>
<script>
'use strict';
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),spots=Array.from(document.querySelectorAll('.spot')),paints=Array.from(document.querySelectorAll('[data-paint]')),sample=document.getElementById('sample'),count=document.getElementById('count'),caption=document.getElementById('caption'),statusText=document.getElementById('status');
const colors=[['#819fc7','#315c8d','#203f69','#eaf6ff'],['#e78d69','#b64139','#862b2d','#fff1d0'],['#edb0bf','#cb708b','#93465c','#fff3e8']];
const centers=[[-134,7,.71],[0,-10,1],[134,7,.71]],colorNames=['синяя','киноварь','розовая'];
let wallOpen=true,phase='sample',selected=1,applied=[false,false,false],startTimes=[-1000,-1000,-1000],wrong=null,doneAt=0,t=0,frameId=0,prev=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=n=>Math.max(0,Math.min(1,n));
function requestDraw(){if(!frameId)frameId=requestAnimationFrame(frame)}
function msg(text){statusText.textContent=text}
function sync(){
 const num=applied.filter(Boolean).length;count.textContent='Готово '+num+' из 3';
 caption.textContent=phase==='sample'?'Образец росписи':phase==='done'?(wallOpen?'Ваш орнамент в мастерской':'Ваше расписанное блюдо'):'Нанесите краску на блюдо';
 sample.textContent=phase==='sample'?(num?'Вернуться к росписи':'Начать роспись'):'Посмотреть образец';
 if(phase==='done')sample.textContent=wallOpen?'Рассмотреть блюдо':'Развернуть орнамент';sample.disabled=false;paints.forEach((p,i)=>{p.setAttribute('aria-pressed',String(i===selected));p.disabled=phase==='done'});
 spots.forEach((b,i)=>{b.disabled=phase!=='paint'||applied[i];b.classList.toggle('done',applied[i]);});
 requestDraw()
}
function reset(){wallOpen=true;phase='sample';selected=1;applied=[false,false,false];startTimes=[-1000,-1000,-1000];wrong=null;doneAt=0;msg('Слева синий цветок, в центре киноварь, справа розовый. Когда запомните, начните роспись.');sync()}
function toPaint(){phase='paint';msg('Выберите краску и нажмите на цветок. Образец можно открыть снова.');sync()}
sample.addEventListener('click',()=>{if(phase==='done'){wallOpen=!wallOpen;sync();return}if(phase==='sample')toPaint();else if(phase==='paint'){phase='sample';wrong=null;msg('Образец открыт. Слева синий цветок, в центре киноварь, справа розовый.');sync()}});
paints.forEach((p,i)=>p.addEventListener('click',()=>{if(phase==='done')return;selected=i;wrong=null;if(phase==='sample')phase='paint';msg('Выбрана краска «'+colorNames[i]+'». Теперь нажмите на цветок.');sync()}));
spots.forEach((b,i)=>b.addEventListener('click',()=>{
 if(phase!=='paint'||applied[i])return;
 if(selected!==i){wrong={i,paint:selected,at:t};msg('Этот цвет отличается от образца. Попробуйте другую краску или откройте образец.');requestDraw();return}
 wrong=null;applied[i]=true;startTimes[i]=t;
 if(applied.every(Boolean)){phase='done';doneAt=t;msg('Блюдо расписано. Ваши три цветка сложились в орнамент на стене. Можно вернуться к блюду и рассмотреть мазки.')}
 else msg('Цвет совпал. Осталось цветков: '+applied.filter(x=>!x).length+'.');
 sync()
}));
document.getElementById('reset').addEventListener('click',reset);
function path(fill,fun,stroke=null,w=1){ctx.beginPath();fun();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.stroke()}}
function oval(x,y,rx,ry,fill,stroke=null,w=1){path(fill,()=>ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2),stroke,w)}
function branch(x,y,a,scale=1){
 ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(scale,scale);
 path(null,()=>{ctx.moveTo(0,0);ctx.bezierCurveTo(16,-2,48,-29,81,-24)},'#254735',2.2);
 for(let j=0;j<4;j++){const xx=14+j*17,yy=-6-j*5;for(const side of [-1,1]){
 ctx.save();ctx.translate(xx,yy);ctx.rotate(side<0?-1.14:.48);ctx.scale(1-j*.095,1-j*.1);
 path(j%2?'#3f6446':'#315e47',()=>{ctx.moveTo(0,0);ctx.bezierCurveTo(6,-9,22,-10,28,-3);ctx.bezierCurveTo(17,4,7,5,0,0)});path(null,()=>{ctx.moveTo(4,0);ctx.quadraticCurveTo(15,-3,23,-3)},'#c5cd89',1.3);ctx.restore()
 }}ctx.restore()
}
const media = {};
for (const key of ['atelier','pigment','gallery']) {
 const im=new Image(); im.onload=requestDraw;im.src='art/craft-'+key+'.webp';media[key]=im;
}
function smooth(n) { n=clamp(n); return n*n*(3-2*n) }
function stencil(x,y,r) {
 ctx.save();ctx.translate(x,y);ctx.strokeStyle='rgba(89,63,33,.40)';ctx.lineWidth=1.25;
 for(let i=0;i<7;i++) {
   ctx.save();ctx.rotate(i*2*Math.PI/7);
   ctx.beginPath();ctx.moveTo(-r*.44,-r*.62);ctx.bezierCurveTo(-r*.43,-r*.91,r*.21,-r*.90,r*.36,-r*.60);ctx.stroke();ctx.restore();
 }
 ctx.beginPath();ctx.ellipse(0,0,r*.55,r*.53,-.16,.3,Math.PI*1.85);ctx.stroke();ctx.restore();
}
function sprigs() {
 for(const side of [-1,1]) {
   ctx.save();ctx.scale(side,1);
   branch(19,33,.54,1.12);branch(47,12,-.48,1.08);branch(88,29,.32,.79);
   branch(159,6,-.30,.77);branch(119,-8,-1.05,.76);
   for(let j=0;j<4;j++) {
     const x=59+j*7,y=53+Math.sin(j)*4;
     oval(x,y,3.3,3.8,'#a53d33');oval(x-1,y-1,.9,.9,'#ffe5b0');
   }
   ctx.restore();
 }
}
function bud(index,x,y,r) {
 const im=media.pigment;
 if(!im.naturalWidth)return;
 const sw=im.naturalWidth/3;
 ctx.drawImage(im,index*sw,0,sw,im.naturalHeight,x-r,y-r,2*r,2*r);
}
function brush(x,y,r,index) {
 ctx.save();ctx.translate(x,y);ctx.rotate(-.58);
 const g=ctx.createLinearGradient(-2.2,0,2.2,0);
 g.addColorStop(0,'#523320');g.addColorStop(.36,'#e4b174');g.addColorStop(.68,'#9a623b');g.addColorStop(1,'#37271d');
 path(g,()=>{ctx.moveTo(-2,-7);ctx.bezierCurveTo(-3,-28,-2,-49,-.3,-61);ctx.bezierCurveTo(1.7,-58,2.5,-24,2,-7);ctx.closePath()});
 ctx.fillStyle='#c8bcb2';ctx.fillRect(-2.1,-13,4.2,6);
 path('#59382a',()=>{ctx.moveTo(-2,-7);ctx.quadraticCurveTo(-2.9,-3,0,2);ctx.quadraticCurveTo(3,-3,2,-7);ctx.closePath()});
 oval(0,1,.9,1.3,colors[index][1]);ctx.restore();
}
function paintFlower(x,y,size,index,amount,guide) {
 const radius=64*size;
 if(guide&&amount<1)stencil(x,y,radius);
 if(amount<=0)return;
 ctx.save();ctx.translate(x,y);
 if(amount<1){
   // Each pass of the brush lays down one curved band of pigment.
   ctx.beginPath();
   const bands=5,pass=amount*bands,bandHeight=radius*2/bands;
   for(let row=0;row<bands;row++) {
     const p=clamp(pass-row);
     if(!p)continue;
     const top=-radius+row*bandHeight,edge=-radius+p*2*radius,odd=row%2===1;
     ctx.moveTo(odd?radius:-radius,top-1);
     ctx.lineTo(odd?-edge:edge,top-1);
     ctx.quadraticCurveTo(odd?-edge-2:edge+2,top+bandHeight*.53,odd?-edge:edge,top+bandHeight+1);
     ctx.lineTo(odd?radius:-radius,top+bandHeight+1);ctx.closePath();
   }
   ctx.clip();
 }
 bud(index,0,0,radius);ctx.restore();
 if(guide&&amount>0&&amount<1){
   const step=Math.min(4,Math.floor(amount*5)),f=amount*5-step;
   const bx=x+radius*(step%2===1?1-f*2:f*2-1),by=y-radius+(step+.5)*radius*2/5;
   brush(bx,by,radius,index);
 }
}
function projection(w,h,alpha) {
 if(alpha<=0)return;
 ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle='#23332a';ctx.fillRect(0,0,w,h);
 const room=media.gallery;
 if(room.naturalWidth)ctx.drawImage(room,0,0,w,h);
 const sx=w/715,sy=h/267,scale=Math.min(sx,sy),cy=h*.421;
 ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=alpha*.90;
 ctx.translate(w/2,cy);ctx.scale(scale,scale);
 sprigs();
 centers.forEach(([x,y,s],i)=>{if(applied[i])bud(i,x,y,62*s)});
 ctx.restore();
 // The border reuses only colours and stamps that the visitor has placed.
 const stride=52*scale,railY=cy+86*scale,stamps=applied.map((placed,i)=>placed?i:-1).filter(i=>i!==-1);
 ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=alpha*.68;
 if(stamps.length)for(let n=-Math.ceil(w/(2*stride));n<=Math.ceil(w/(2*stride));n++){
   const x=w/2+n*stride,idx=stamps[((n%stamps.length)+stamps.length)%stamps.length];
   ctx.save();ctx.translate(x,railY);ctx.scale(scale,scale);
   branch(6,1,.17,.26);bud(idx,0,0,12);ctx.restore();
 }
 ctx.restore();ctx.restore();
}
function paint() {
 const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;
 ctx.setTransform(canvas.width/w,0,0,canvas.height/h,0,0);
 const image=media.atelier,layerW=Math.min(Math.max(w,h*2.5),w*1.34),layerH=layerW/2.5;
 const left=(w-layerW)*.5,top=(h-layerH)*.5;
 ctx.fillStyle='#283426';ctx.fillRect(0,0,w,h);
 if(image.naturalWidth){
   // Extend the real tabletop to the frame edge in the tall mobile viewport.
   if(layerH<h)ctx.drawImage(image,0,0,image.width*.08,image.height,0,0,w,h);
   ctx.drawImage(image,left,top,layerW,layerH);
 }
 const scale=layerW*.738/536,cx=left+layerW*.489,cy=top+layerH*.506;
 ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);
 sprigs();
 centers.forEach(([x,y,size],i)=>{
   const visible=phase==='sample'||applied[i],attempt=wrong&&wrong.i===i&&t-wrong.at<.82;
   const amount=visible?(phase==='sample'||reduced?1:smooth((t-startTimes[i])/.82)):0;
   if(attempt&&!visible) {
     stencil(x,y,64*size);ctx.save();ctx.globalAlpha=.65*(1-smooth((t-wrong.at-.36)/.46));bud(wrong.paint,x,y,64*size);ctx.restore();
   }else paintFlower(x,y,size,i,amount,phase!=='sample');
   spots[i].style.left=(cx+x*scale)+'px';spots[i].style.top=(cy+y*scale)+'px';
 });
 ctx.restore();
 const show=phase==='done'&&wallOpen?(reduced?1:smooth((t-doneAt-.9)/.7)):0;
 projection(w,h,show);
}

function frame(now){frameId=0;const dt=Math.min(.06,prev?(now-prev)/1000:0);prev=now;t+=dt;paint();
 if((phase==='done'&&!reduced&&t-doneAt<1.75)||(wrong&&t-wrong.at<.95)||startTimes.some(s=>!reduced&&t-s<.9))requestDraw()
}
new ResizeObserver(()=>{const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(canvas.clientWidth*d);canvas.height=Math.round(canvas.clientHeight*d);requestDraw()}).observe(canvas);reset();
</script></body></html>
