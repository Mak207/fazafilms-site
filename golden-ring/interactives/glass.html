<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дыхание стекла</title><link rel="stylesheet" href="apparatus.css"><style>.process{margin:1rem 0;background:#181a18;text-align:center}.process img{display:block;width:100%;height:min(58vh,510px);object-fit:contain}.stages{display:flex;gap:.4rem;flex-wrap:wrap}.stages [aria-current]{background:#294d49;color:#fff}</style></head><body><header><a href="../#interactives">← Интерактивы</a><a href="apparatus.html?scene=glass">Верстак в 3D →</a></header><main><h1>Дыхание стекла</h1><p>Нажмите на рукоять меха. На экране верстака мастер выдует форму, затем в холодном цехе другой мастер нарежет грани.</p><figure class="process"><img id="process" src="art/glass-process/1.webp" alt="Стеклодув у печи"></figure><h2 id="state" aria-live="polite"></h2><p id="caption"></p><button class="primary" id="blow">Нажать на мех</button> <button id="stop">Задержать кадр</button><p class="stages" aria-label="Рассмотреть этап"></p></main><script>
const steps=[['Выдувание','У печи стеклодув выдувает горячую заготовку на трубке.'],['Гладкая заготовка','После охлаждения стенки стакана остаются гладкими.'],['Холодная огранка','В другом цехе мастер прижимает остывший стакан к мокрому алмазному кругу.'],['Свет в гранях','Луч меняет направление в хрустале. На столе виден цветной спектр.']];
let timer=0,index=0;
function show(i){index=i;const [name,text]=steps[i],im=document.querySelector('#process');im.src='art/glass-process/'+(i+1)+'.webp';im.alt=text;document.querySelector('#state').textContent=name;document.querySelector('#caption').textContent=text;document.querySelectorAll('.stages button').forEach((b,j)=>{if(j===i)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});}
function pause(){clearInterval(timer);timer=0;document.querySelector('#stop').disabled=true;}
steps.forEach(([label],i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{pause();show(i)};document.querySelector('.stages').append(b)});
document.querySelector('#blow').onclick=()=>{pause();show(0);document.querySelector('#stop').disabled=false;timer=setInterval(()=>{show(index+1);if(index===3)pause();},1900);};document.querySelector('#stop').onclick=pause;pause();show(0);
</script></body></html>
