<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дыхание стекла · мастерская</title>
<style>
:root{color-scheme:dark;--ink:#f7eee1;--muted:#c6bba9;--gold:#ffc073;--line:#56463c}
*{box-sizing:border-box}body{margin:0;background:#15191c;color:var(--ink);font:16px/1.45 Arial,sans-serif}
main{max-width:1150px;margin:auto;padding:clamp(15px,3vw,34px)}header{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:15px}
h1{font:normal clamp(29px,4.5vw,48px)/1.06 Georgia,serif;margin:6px 0 2px}.kicker{font-size:12px;color:var(--gold);letter-spacing:.05em}.sub{font-size:14px;color:var(--muted);margin:0}
.stage{position:relative;isolation:isolate;border:1px solid #59453c;border-radius:14px;background:#17191b;overflow:hidden}.stage canvas{display:block;width:100%;height:clamp(210px,36vw,420px)}.scene-caption{position:absolute;bottom:8px;left:12px;background:#111719cc;border-radius:3px;padding:2px 7px;color:#fff1d8;font-size:12px;pointer-events:none}
.workbench{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-top:14px;align-items:start}.flow label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:bold}.flow output{color:var(--gold);font-variant-numeric:tabular-nums}.range{width:100%;min-height:34px;accent-color:var(--gold);margin:0}
.hint,.status{margin:0;color:var(--muted);font-size:14px}.status{min-height:25px;color:var(--ink);margin:5px 0}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{border:1px solid var(--line);border-radius:6px;background:#242a2c;color:var(--ink);padding:10px 14px;min-height:44px;font:600 14px Arial,sans-serif;cursor:pointer}button.main{background:#f4b96e;color:#25201c;border-color:transparent}button:hover{filter:brightness(1.1)}button:disabled{cursor:default;opacity:.58}:focus-visible{outline:3px solid #b9ecf1;outline-offset:3px}
progress{width:100%;height:8px;display:block;accent-color:#deb775;margin:10px 0 4px}.feedback{border-top:1px solid var(--line);margin-top:12px;padding-top:7px}.legend{font-size:12px;color:var(--muted);margin:0}.read{font-size:12px;letter-spacing:.04em;font-weight:bold;color:#c7bba5;text-transform:uppercase}
@media(max-width:620px){main{padding:12px}.workbench{grid-template-columns:1fr;gap:10px}h1{font-size:30px}.stage canvas{height:220px}.sub{font-size:13px}.feedback{margin-top:8px}.actions button{flex:1}.actions{flex-wrap:nowrap}.read{display:none}}
.lamp{margin-top:14px;max-width:520px}.lamp[hidden]{display:none}.lamp-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-5px}.stage canvas{background:#211e18}.scene-caption{left:14px;bottom:12px;background:#191c1bd9;padding:4px 9px}.workbench button,.lamp input{touch-action:manipulation}</style></head>
<body><main>
<header><div><span class="kicker">Мастерская · Гусь-Хрустальный</span><h1>Дыхание стекла</h1></div></header>
<div class="stage"><canvas id="art" aria-label="Заготовка на трубке. На глазах она превращается в стеклянный сосуд."></canvas><span class="scene-caption" id="caption">Заготовка на трубке</span></div>
<div class="workbench"><div class="flow"><label for="air">Сила потока <output id="strength" for="air">50 %</output></label><input class="range" id="air" type="range" min="0" max="100" value="50"><p class="hint">Рабочий диапазон 35–70 %. Во время выдувания можно менять поток.</p></div>
<div><div class="actions"><button class="main" id="pump">Подать воздух</button><button id="reset">Начать заново</button></div><progress id="progress" value="0" max="1" aria-label="Готовность сосуда"></progress><p class="legend" id="progressText">Форма набрана на 0 %</p></div></div>
<div class="flow lamp" id="lamp-control" hidden><label for="lamp">Положение света</label><input class="range" id="lamp" type="range" min="-100" max="100" value="0" aria-label="Положение света слева направо"><div class="lamp-ends"><span>Слева</span><span>Справа</span></div></div>
<div class="feedback"><p class="status" role="status" id="status">Нажмите «Подать воздух». Стекло начнёт расти на конце трубки.</p></div>
</main><script>
'use strict';
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),air=document.getElementById('air'),pump=document.getElementById('pump'),strength=document.getElementById('strength'),statusText=document.getElementById('status'),caption=document.getElementById('caption'),progress=document.getElementById('progress'),progressText=document.getElementById('progressText');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let state='idle',volume=0,stress=0,finishAt=0,time=0,last=0,raf=0,lastPercent=-1;
function message(t){if(statusText.textContent!==t)statusText.textContent=t}
function updateProgress(){
 const pct=Math.round(volume*100);if(pct===lastPercent)return;lastPercent=pct;
 progress.value=volume;progressText.textContent='Форма набрана на '+pct+' %';
}
function drawNow(){if(!raf)raf=requestAnimationFrame(frame)}
function reset(){lampControl.hidden=true;lamp.value=0;state='idle';volume=0;stress=0;time=0;last=0;lastPercent=-1;air.value=50;air.disabled=false;pump.disabled=false;pump.textContent='Подать воздух';pump.setAttribute('aria-pressed','false');strength.textContent='50 %';caption.textContent='Горячее стекло на трубке';message('Нажмите «Подать воздух». Стекло начнёт расти на конце трубки.');updateProgress();drawNow()}
function toggle(){
 if(state==='done'||state==='broken')return;
 if(state==='active'){state='paused';pump.textContent='Продолжить';pump.setAttribute('aria-pressed','false');message('Поток остановлен. Можно изменить силу и продолжить.')}
 else{state='active';pump.textContent='Остановить поток';pump.setAttribute('aria-pressed','true');caption.textContent='Горячая масса · выдувание';message('Воздух раздвигает стенки заготовки.');last=0}
 drawNow()
}
function end(success){state=success?'done':'broken';finishAt=time;lampControl.hidden=!success;air.disabled=true;pump.disabled=true;pump.setAttribute('aria-pressed','false');pump.textContent=success?'Сосуд готов':'Поток остановлен';caption.textContent=success?'Холодный хрусталь · рисунок света на столе':'Стекло распалось';message(success?'Сосуд готов. После охлаждения и огранки он преломляет свет. Передвиньте свет и посмотрите, как меняется узор на столе.':'Слишком сильный поток растянул стенки. Начните заново и уменьшите силу до 35–70 %.')}
pump.addEventListener('click',toggle);document.getElementById('reset').addEventListener('click',reset);
air.addEventListener('input',()=>{strength.textContent=air.value+' %';drawNow()});
function configure(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(canvas.clientWidth*d);canvas.height=Math.round(canvas.clientHeight*d);drawNow()}
new ResizeObserver(configure).observe(canvas);
const surfaces = {};
for (const key of ['atelier','gather','vase','light']) {
 const image = new Image();
 image.onload = drawNow;
 image.src = 'art/glass-' + key + '.webp';
 surfaces[key] = image;
}
const lamp = document.getElementById('lamp');
const lampControl = document.getElementById('lamp-control');
lamp.addEventListener('input', drawNow);
function smooth(n) { n = Math.max(0, Math.min(1,n)); return n*n*(3-2*n); }
function material(key, x, y, w, h, alpha=1) {
 const im = surfaces[key];
 if (!im || !im.naturalWidth || alpha <= 0) return;
 ctx.save(); ctx.globalAlpha=alpha;
 ctx.globalCompositeOperation = key==='atelier'?'source-over':'screen';
 ctx.drawImage(im,x,y,w,h); ctx.restore();
}
function glow(x,y,rx,ry,color) {
 ctx.save();ctx.translate(x,y);ctx.scale(rx,ry);
 const g=ctx.createRadialGradient(0,0,0,0,0,1);
 g.addColorStop(0,color);g.addColorStop(1,'transparent');
 ctx.fillStyle=g;ctx.fillRect(-1,-1,2,2);ctx.restore();
}
function paint() {
 const w=canvas.clientWidth,h=canvas.clientHeight;
 if(!w||!h)return;
 ctx.setTransform(canvas.width/w,0,0,canvas.height/h,0,0);
 ctx.fillStyle='#201e1b';ctx.fillRect(0,0,w,h);
 const sceneW=Math.max(w,h*2.5),sceneH=sceneW/2.5;
 material('atelier', (w-sceneW)*.36,(h-sceneH)*.52,sceneW,sceneH);
 const center=w*(w/h<1.9?.57:.54),base=.83*h;
 const finish=state==='done'?(reduce?1:smooth((time-finishAt)/1.2)):0;
 const broken=state==='broken', brokenT=broken?(reduce?1:smooth((time-finishAt)/.85)):0;
 const hotH=h*(.30+.32*volume), coldH=h*.69,topHot=h*(.30-.10*volume),topCold=base-coldH;
 const top=topHot+(topCold-topHot)*finish;
 const flutter=state==='active'&&!reduce?(Math.sin(time*(3+stress*8))*.007+Math.sin(time*17)*.011*Math.min(1,stress)):0;
 const hotW=hotH*.689*(.78+volume*.22+flutter),coldW=coldH*.636;
 const lampPos=Number(lamp.value)/100;
 const shadow=broken?.2:.17+finish*.5;
 glow(center,base+3,h*.23,h*.041,'rgba(3,7,7,'+shadow+')');
 if(finish>0) {
   const lightW=Math.min(w*.64,h*1.39);
   const lightX=center+(lampPos*.29+.08)*h;
   ctx.save();ctx.translate(lightX,base+h*.014);ctx.transform(1,-.025-lampPos*.019,.14,1,0,0);
   material('light',-lightW*.48,-h*.092,lightW,h*.21,finish);ctx.restore();
 }
 if(!broken&&finish<1) {
   glow(center,base,h*(.13+.17*volume),h*.073,'rgba(252,102,25,'+((.17+volume*.09)*(1-finish))+')');
   glow(center,top+hotH*.60,hotW*.90,hotH*.61,'rgba(250,111,27,'+((.29+volume*.10)*(1-finish))+')');
 }
 if(finish<1) {
   const rodEnd=top+h*.025-finish*h*.44;
   ctx.save();ctx.translate(center,rodEnd);ctx.rotate(.12);
   const thick=Math.max(3,h*.019);
   const g=ctx.createLinearGradient(-thick,0,thick,0);
   for(const [d,c] of [[0,'#211d1c'],[.22,'#5f5144'],[.40,'#d5c9b4'],[.54,'#9c9d9b'],[.83,'#484746'],[1,'#242426']])g.addColorStop(d,c);
   ctx.fillStyle=g;ctx.fillRect(-thick,-h,2*thick,h);
   const heat=ctx.createLinearGradient(0,-h*.085,0,0);heat.addColorStop(0,'#9e3b0600');heat.addColorStop(1,'#f78c3a');
   ctx.fillStyle=heat;ctx.fillRect(-thick,-h*.085,thick*2,h*.085);ctx.restore();
 }
 if(!broken) {
   material('gather',center-hotW/2,top,hotW,hotH,1-finish);
   material('vase',center-coldW/2,top,coldW,coldH,finish);
   if(finish>.65) {
     const pinX=center+(lampPos*.18-.11)*coldW,pinY=top+coldH*(.61+.11*lampPos);
     glow(pinX,pinY,coldW*.05,coldW*.05,'rgba(249,255,255,'+((finish-.65)*1.35)+')');
   }
 } else {
   const img=surfaces.gather;
   if(img.naturalWidth)for(let i=0;i<19;i++){
     const a=i*2.39996,dx=Math.cos(a),depth=Math.sin(a);
     const r=h*(.018+.031*((i*13)%11)/10),x=center+(dx*.80+(i%3-1)*.1)*h*.34*brokenT;
     const y=(topHot+hotH*.58)*(1-brokenT)+(base+depth*h*.044)*brokenT-Math.sin(Math.PI*brokenT)*h*(.07+.10*Math.abs(dx));
     ctx.save();ctx.translate(x,y);ctx.rotate(a+brokenT*.9);
     ctx.beginPath();ctx.moveTo(-r,-r*.33);ctx.lineTo(r*.25,-r*.43);ctx.lineTo(r*1.12,-r*.18);ctx.lineTo(-r*.38,r*(i%2?.53:.22));ctx.closePath();ctx.strokeStyle='rgba(232,201,164,.67)';ctx.lineWidth=.7;ctx.stroke();ctx.clip();
     ctx.fillStyle='#493727';ctx.fillRect(-2*r,-2*r,4*r,4*r);ctx.globalCompositeOperation='screen';ctx.globalAlpha=.72-brokenT*.35;
     ctx.drawImage(img,img.width*(.18+(i%4)*.1),img.height*(.2+(i%5)*.09),img.width*.2,img.height*.14,-r,-r,2.2*r,2*r);
     const crystal=surfaces.vase;if(crystal.naturalWidth){ctx.globalAlpha=.58*brokenT;ctx.drawImage(crystal,crystal.width*.35,crystal.height*(.33+i%3*.10),crystal.width*.18,crystal.height*.13,-r,-r,2.2*r,2*r)}
     ctx.restore();
   }
 }
}

function frame(now){
 raf=0;const dt=Math.min(.05,last?(now-last)/1000:0);last=now;time+=dt;
 if(state==='active'){
   const power=Number(air.value);
   if(power>70){stress+=dt*(power-60)/30;message('Слишком сильный поток. Уменьшите его до 70 % или ниже.');if(stress>1.6)end(false)}
   else if(power<35){stress=Math.max(0,stress-dt);message('Стекло почти не расширяется. Добавьте воздуха до 35 %.')}
   else{stress=Math.max(0,stress-dt);volume=Math.min(1,volume+dt*(.13+power/700));message('Стенки раздвигаются равномерно. Сохраняйте поток в рабочем диапазоне.');updateProgress();if(volume>=1)end(true)}
 }
 paint();if(state==='active'||((state==='done'||state==='broken')&&!reduce&&time-finishAt<2.7))drawNow()
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='active')toggle()});reset();
</script></body></html>
