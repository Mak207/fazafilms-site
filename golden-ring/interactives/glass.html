<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дыхание стекла · мастерская</title>
<style>
:root{color-scheme:dark;--ink:#f7eee1;--muted:#c6bba9;--gold:#ffc073;--line:#56463c}
*{box-sizing:border-box}body{margin:0;background:#15191c;color:var(--ink);font:16px/1.45 Arial,sans-serif}
main{max-width:1150px;margin:auto;padding:clamp(15px,3vw,34px)}header{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:15px}
h1{font:normal clamp(29px,4.5vw,48px)/1.06 Georgia,serif;margin:6px 0 2px}.kicker{font-size:12px;color:var(--gold);letter-spacing:.05em}.sub{font-size:14px;color:var(--muted);margin:0}
.stage{position:relative;isolation:isolate;border:1px solid #59453c;border-radius:14px;background:#17191b;overflow:hidden}.stage canvas{display:block;width:100%;height:clamp(210px,36vw,420px)}.scene-caption{position:absolute;bottom:8px;left:12px;background:#111719cc;border-radius:3px;padding:2px 7px;color:#fff1d8;font-size:12px;pointer-events:none}
.workbench{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-top:14px;align-items:start}.flow label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:bold}.flow output{color:var(--gold);font-variant-numeric:tabular-nums}.range{width:100%;min-height:34px;accent-color:var(--gold);margin:0}
.hint,.status{margin:0;color:var(--muted);font-size:14px}.status{min-height:25px;color:var(--ink);margin:5px 0}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{border:1px solid var(--line);border-radius:6px;background:#242a2c;color:var(--ink);padding:10px 14px;min-height:44px;font:600 14px Arial,sans-serif;cursor:pointer}button.main{background:#f4b96e;color:#25201c;border-color:transparent}button:hover{filter:brightness(1.1)}button:disabled{cursor:default;opacity:.58}:focus-visible{outline:3px solid #b9ecf1;outline-offset:3px}
progress{width:100%;height:8px;display:block;accent-color:#deb775;margin:10px 0 4px}.feedback{border-top:1px solid var(--line);margin-top:12px;padding-top:7px}.legend{font-size:12px;color:var(--muted);margin:0}.read{font-size:12px;letter-spacing:.04em;font-weight:bold;color:#c7bba5;text-transform:uppercase}
@media(max-width:620px){main{padding:12px}.workbench{grid-template-columns:1fr;gap:10px}h1{font-size:30px}.stage canvas{height:220px}.sub{font-size:13px}.feedback{margin-top:8px}.actions button{flex:1}.actions{flex-wrap:nowrap}.read{display:none}}
</style></head>
<body><main>
<header><div><span class="kicker">Мастерская · Гусь-Хрустальный</span><h1>Дыхание стекла</h1></div><span class="read">Эскиз интерактива</span></header>
<div class="stage"><canvas id="art" aria-label="Заготовка на трубке. На глазах она превращается в стеклянный сосуд."></canvas><span class="scene-caption" id="caption">Заготовка на трубке</span></div>
<div class="workbench"><div class="flow"><label for="air">Сила потока <output id="strength" for="air">50 %</output></label><input class="range" id="air" type="range" min="0" max="100" value="50"><p class="hint">Рабочий диапазон 35–70 %. Во время выдувания можно менять поток.</p></div>
<div><div class="actions"><button class="main" id="pump">Подать воздух</button><button id="reset">Начать заново</button></div><progress id="progress" value="0" max="1" aria-label="Готовность сосуда"></progress><p class="legend" id="progressText">Форма набрана на 0 %</p></div></div>
<div class="feedback"><p class="status" role="status" id="status">Нажмите «Подать воздух». Стекло начнёт расти на конце трубки.</p></div>
</main><script>
'use strict';
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),air=document.getElementById('air'),pump=document.getElementById('pump'),strength=document.getElementById('strength'),statusText=document.getElementById('status'),caption=document.getElementById('caption'),progress=document.getElementById('progress'),progressText=document.getElementById('progressText');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let state='idle',volume=0,stress=0,finishAt=0,time=0,last=0,raf=0,lastPercent=-1;
function message(t){if(statusText.textContent!==t)statusText.textContent=t}
function updateProgress(){
 const pct=Math.round(volume*100);if(pct===lastPercent)return;lastPercent=pct;
 progress.value=volume;progressText.textContent='Форма набрана на '+pct+' %';
}
function drawNow(){if(!raf)raf=requestAnimationFrame(frame)}
function reset(){state='idle';volume=0;stress=0;time=0;last=0;lastPercent=-1;air.value=50;air.disabled=false;pump.disabled=false;pump.textContent='Подать воздух';pump.setAttribute('aria-pressed','false');strength.textContent='50 %';caption.textContent='Заготовка на трубке';message('Нажмите «Подать воздух». Стекло начнёт расти на конце трубки.');updateProgress();drawNow()}
function toggle(){
 if(state==='done'||state==='broken')return;
 if(state==='active'){state='paused';pump.textContent='Продолжить';pump.setAttribute('aria-pressed','false');message('Поток остановлен. Можно изменить силу и продолжить.')}
 else{state='active';pump.textContent='Остановить поток';pump.setAttribute('aria-pressed','true');caption.textContent='Выдувание сосуда';message('Воздух раздвигает стенки заготовки.');last=0}
 drawNow()
}
function end(success){state=success?'done':'broken';finishAt=time;air.disabled=true;pump.disabled=true;pump.setAttribute('aria-pressed','false');pump.textContent=success?'Сосуд готов':'Поток остановлен';caption.textContent=success?'Свет проходит через готовую форму':'Стекло распалось';message(success?'Сосуд готов. Его грани отбрасывают на стены мастерской световой узор.':'Слишком сильный поток растянул стенки. Начните заново и уменьшите силу до 35–70 %.')}
pump.addEventListener('click',toggle);document.getElementById('reset').addEventListener('click',reset);
air.addEventListener('input',()=>{strength.textContent=air.value+' %';drawNow()});
function configure(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(canvas.clientWidth*d);canvas.height=Math.round(canvas.clientHeight*d);drawNow()}
new ResizeObserver(configure).observe(canvas);
function grad(x,y,r,stops){const g=ctx.createRadialGradient(x,y,1,x,y,Math.max(2,r));for(const [n,c] of stops)g.addColorStop(n,c);return g}
function line(x1,y1,x2,y2,color,width=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function ellipse(x,y,rx,ry,c){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}
function glassOutline(top,h,r,v){
 const body=new Path2D();body.moveTo(-8,top);body.bezierCurveTo(-8,top+h*.12,-r*(.43+v*.16),top+h*(.13+v*.14),-r*.89,top+h*.47);
 body.bezierCurveTo(-r*1.20,top+h*.70,-r*.78,top+h*.98,-r*.44,top+h);body.quadraticCurveTo(0,top+h*1.05,r*.44,top+h);
 body.bezierCurveTo(r*.78,top+h*.98,r*1.20,top+h*.70,r*.89,top+h*.47);body.bezierCurveTo(r*(.43+v*.16),top+h*(.13+v*.14),8,top+h*.12,8,top);body.closePath();return body
}
function paint(){
 const w=canvas.width,h=canvas.height;if(!w||!h)return;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#111820';ctx.fillRect(0,0,w,h);
 const scale=h/350,W=w/scale;ctx.scale(scale,scale);const cx=W*.53;
 ctx.fillStyle=grad(W*.15,190,Math.min(330,W*.65),[[0,'#6c321d'],[.33,'#38251f'],[1,'#101921']]);ctx.fillRect(0,0,W,350);
 for(let j=0;j<9;j++){const y=j*31;line(0,y,W*.30,y,'rgba(172,115,76,.12)');for(let k=0;k<W*.30;k+=65)line(k+32*(j%2),y,k+32*(j%2),y+30,'rgba(172,115,76,.12)')}
 const furnaceX=Math.min(90,W*.14),fr=Math.min(62,W*.125);ctx.save();ctx.translate(furnaceX,208);
 ctx.beginPath();ctx.arc(0,0,fr,Math.PI,0);ctx.lineTo(fr,37);ctx.lineTo(-fr,37);ctx.closePath();ctx.fillStyle=grad(0,12,fr*1.25,[[0,'#fff1a0'],[.42,'#ffad41'],[.78,'#a94719'],[1,'#352526']]);ctx.fill();ctx.strokeStyle='#5e4d41';ctx.lineWidth=8;ctx.stroke();ctx.restore();
 ctx.fillStyle='#1a2125';ctx.fillRect(0,281,W,69);const floor=ctx.createLinearGradient(0,281,0,350);floor.addColorStop(0,'#374244');floor.addColorStop(.13,'#202a2c');floor.addColorStop(1,'#11191c');ctx.fillStyle=floor;ctx.fillRect(0,281,W,69);
 ellipse(cx,298,105,13,grad(cx,298,110,[[0,'#82908b'],[.58,'#475052'],[1,'#222c2e']]));ellipse(cx,299,91,7,'#273236');
 const endT=(reduce?1:Math.min(1,(time-finishAt)/1.1));const finish=state==='done'?endT:0;
 if(finish>0){
   ctx.save();ctx.translate(cx,200);ctx.globalAlpha=finish*.62;const rays=28;
   for(let i=0;i<rays;i++){const a=i*2*Math.PI/rays+(reduce?0:Math.min(time-finishAt,2.7)*.065),b=a+.13,len=Math.max(W,450);const glow=ctx.createLinearGradient(0,0,Math.cos(a)*len,Math.sin(a)*len);glow.addColorStop(0,'#b4f0e599');glow.addColorStop(.5,i%2?'#8ce4dc43':'#e7b9856b');glow.addColorStop(1,'#81b7be00');ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*len,Math.sin(a)*len);ctx.lineTo(Math.cos(b)*len,Math.sin(b)*len);ctx.closePath();ctx.fillStyle=glow;ctx.fill()}
   ctx.restore()
 }
 const g=ctx.createLinearGradient(cx-6,0,cx+7,0);g.addColorStop(0,'#574f49');g.addColorStop(.32,'#b6b8ad');g.addColorStop(.57,'#e3dfc0');g.addColorStop(.72,'#7c7b72');g.addColorStop(1,'#4d4e4b');ctx.fillStyle=g;ctx.fillRect(cx-6,0,12,100-finish*52);
 const top=96+finish*21,r=24+volume*56,gh=57+volume*120;
 ctx.save();ctx.translate(cx,0);
 if(state!=='broken'){
   const body=glassOutline(top,gh,r,volume);ctx.fillStyle=grad(0,top+gh*.55,r*1.65,[[0,finish?'#baffdf5c':'#ffbe54a0'],[1,'#00000000']]);ctx.fillRect(-r*1.8,top-20,r*3.6,gh+48);
   const cg=ctx.createLinearGradient(-r,0,r,0);
   for(const [s,col] of (finish>0?[[0,'#b3e3df'],[.10,'#336562'],[.26,'#b0f0e9b0'],[.48,'#376c6cbd'],[.70,'#73bdaf'],[.88,'#284e54'],[1,'#a7ddd3']]:[[0,'#d85e24'],[.10,'#ffb95b'],[.26,'#ffe4a1'],[.5,'#e58e48'],[.75,'#e97934'],[.9,'#ffca71'],[1,'#a94727']]))cg.addColorStop(s,col);
   ctx.fillStyle=cg;ctx.fill(body);ctx.save();ctx.clip(body);
   for(let i=0;i<12;i++){ctx.beginPath();for(let j=0;j<=65;j++){const t=j/65,x=(i-6)*r*.44+Math.sin(t*3.7+i*.28+(reduce?0:time*.44))*(r*.4),y=top+gh*t;if(j)ctx.lineTo(x,y);else ctx.moveTo(x,y)}ctx.strokeStyle=finish?'#e0fff398':'#fff0c275';ctx.lineWidth=1.2;ctx.stroke()}
   if(finish){for(let j=-4;j<8;j++){line(-r,top+j*26,r,top+j*26+96,'#bef7eb96',1.4);line(-r,top+j*26+96,r,top+j*26,'#dbfff58c',1.3)}}
   ctx.beginPath();ctx.moveTo(-r*.65,top+gh*.43);ctx.quadraticCurveTo(-r,top+gh*.7,-r*.55,top+gh*.87);ctx.strokeStyle=finish?'#e3fff3':'#fff0bf';ctx.lineWidth=3;ctx.stroke();
   ctx.restore();ctx.strokeStyle=finish?'#ebfff0':'#ffe0a4';ctx.lineWidth=1.5;ctx.stroke(body);ellipse(0,top,9,3.4,finish?'#d6fff0':'#ffbc66')
 }else{
   const t=reduce?1:Math.min(1,(time-finishAt)/.68);
   for(let i=0;i<28;i++){const a=i*2.39996,rad=(20+(i*17)%93)*t,x=Math.cos(a)*rad,y=180+(100+14*Math.sin(i))*t+Math.sin(a)*15*(1-t);ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.beginPath();ctx.moveTo(-6,-4);ctx.lineTo(12,0);ctx.lineTo(-1,5);ctx.closePath();ctx.fillStyle=i%2?'#f0b97d':'#bb8a68';ctx.fill();ctx.restore()}
 }
 if(state==='active'&&Number(air.value)>70){ctx.strokeStyle='#ff784b';ctx.lineWidth=2;ctx.setLineDash([4,7]);ctx.beginPath();ctx.ellipse(0,top+gh*.63,r+9,gh*.39,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
 ctx.restore()
}
function frame(now){
 raf=0;const dt=Math.min(.05,last?(now-last)/1000:0);last=now;time+=dt;
 if(state==='active'){
   const power=Number(air.value);
   if(power>70){stress+=dt*(power-60)/30;message('Слишком сильный поток. Уменьшите его до 70 % или ниже.');if(stress>1.6)end(false)}
   else if(power<35){stress=Math.max(0,stress-dt);message('Стекло почти не расширяется. Добавьте воздуха до 35 %.')}
   else{stress=Math.max(0,stress-dt);volume=Math.min(1,volume+dt*(.13+power/700));message('Стенки раздвигаются равномерно. Сохраняйте поток в рабочем диапазоне.');updateProgress();if(volume>=1)end(true)}
 }
 paint();if(state==='active'||((state==='done'||state==='broken')&&!reduce&&time-finishAt<2.7))drawNow()
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='active')toggle()});reset();
</script></body></html>
