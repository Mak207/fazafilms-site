<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Билет путешественника · Золотое кольцо</title>
<style>
:root{color-scheme:light;--olive:#25493e;--paper:#f5eddb;--ink:#292d24;--gold:#bca462;--line:#c6b99c}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 Arial,sans-serif;color:var(--ink);background:#f8f4ea}main{max-width:1150px;margin:auto;padding:clamp(12px,2.1vw,26px)}h1,h2,p{margin:0}h1{font:clamp(26px,4.2vw,45px)/1.12 Georgia,serif}header p{margin:5px 0 16px;color:#524f44}.exhibit{overflow:hidden;border:1px solid #cbbda4;border-radius:12px;box-shadow:0 8px 23px #3f392013}.map{background:#14352f;position:relative;height:clamp(200px,31vw,320px);overflow:hidden}.map canvas{width:100%;height:100%;display:block}.map-key{position:absolute;left:12px;top:10px;padding:3px 8px;color:#f5e8cd;background:#15362be8;border:1px solid #a797695b;border-radius:4px;font-size:12px}.ticket{position:relative;display:grid;grid-template-columns:1fr .94fr;background:linear-gradient(115deg,#fff9e9,#f1e7cc)}.controls,.pass{padding:clamp(14px,2vw,23px)}.pass{position:relative;border-left:2px dashed #ab9672;padding-left:clamp(18px,3vw,35px)}.pass::before,.pass::after{position:absolute;content:"";width:17px;height:17px;border-radius:50%;background:#f8f4ea;left:-9.5px}.pass::before{top:-9px}.pass::after{bottom:-9px}h2{font:23px/1.2 Georgia,serif}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.chip{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid #a69b7f;background:#fffcf3;color:#2c372d;padding:8px 12px;border-radius:20px;font:15px/1.15 Arial;min-height:42px;cursor:pointer}.chip svg{display:none}.chip[aria-pressed=true]{background:#264b3d;color:#fffcef;border-color:#264b3d}.chip:disabled:not([aria-pressed=true]){opacity:.5}.chip:focus-visible,button:focus-visible{outline:3px solid #bc680a;outline-offset:3px}.marks{display:flex;gap:9px;margin:10px 0 13px}.mark{position:relative;display:grid;place-items:center;border:1px dashed #a29470;border-radius:50%;width:clamp(49px,6vw,69px);aspect-ratio:1;background:#fff8e62c;color:#776b52;font-size:15px}.mark canvas{width:100%;height:100%}.mark.full{border-color:transparent;background:transparent}.mark.pop{animation:stamp .3s ease-out}@keyframes stamp{0%{transform:scale(1.25) rotate(8deg);opacity:.2}72%{transform:scale(.96) rotate(-4deg)}100%{transform:scale(1)}}.counter{font-size:14px;margin-top:9px;color:#625b48}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.actions button{min-height:43px;padding:9px 16px;border-radius:5px;cursor:pointer;font:600 14px/1.2 Arial}.go{border:1px solid #23483a;background:#23483a;color:#fff}.go:disabled{background:#d7d0bd;color:#635d50;cursor:default;border-color:#c1b9a4}.reset{color:#354137;border:1px solid #a3987c;background:transparent}.result{margin-top:13px;padding:12px 16px;border-left:3px solid #916c31;background:#fffaf0}.result h2{font-size:21px}.result ol{margin:7px 0;padding-left:20px}.result li{margin:3px 0}.result li span{color:#545647}.result[hidden]{display:none}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:600px){main{padding:9px}.map{height:207px}.ticket{grid-template-columns:1fr}.controls{padding:12px 14px}.pass{border-left:0;border-top:1px dashed #ae9a75;padding:11px 14px;display:grid;grid-template-columns:1fr auto;gap:1px 10px;align-items:center}.pass:before,.pass:after{display:none}.pass h2{font-size:17px}.marks{margin:4px 0;grid-row:2;gap:4px}.mark{width:44px}.actions{grid-column:2;grid-row:1/3;flex-direction:column;align-items:stretch}.actions button{min-height:38px;padding:7px 10px}.chips{gap:6px;margin-top:7px}.chip{font-size:14px;min-height:38px;padding:7px 10px}header p{font-size:14px;margin-bottom:10px}.controls h2{font-size:19px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>
<header><h1>Билет путешественника</h1><p>Отметьте три впечатления и отсканируйте билет. На карте загорится ваш маршрут.</p></header>
<div class="exhibit"><div class="map"><canvas id="atlas" aria-hidden="true"></canvas><span class="map-key">Схема маршрута</span></div>
<div class="ticket"><section class="controls" aria-labelledby="pick-title"><h2 id="pick-title">Что вам запомнилось?</h2><div class="chips" id="chips"></div><p class="counter" id="counter" aria-live="polite">Штампов в билете: 0 из 3</p></section>
<section class="pass" aria-labelledby="ticket-title"><h2 id="ticket-title">Ваш билет</h2><div class="marks" id="marks" aria-label="Штампы билета"></div><div class="actions"><button class="go" id="scan" disabled>Сканировать билет</button><button class="reset" id="reset" hidden>Новый билет</button></div></section></div></div>
<section id="result" class="result" hidden tabindex="-1"><h2>Ваш маршрут</h2><ol id="stops"></ol></section>
</main><script>
'use strict';
const places=[
 {label:'Хрусталь',town:'Гусь-Хрустальный',detail:'художественное стекло',x:.80,y:.72,color:'#1b6573',glyph:'crystal'},
 {label:'Миниатюра',town:'Палех',detail:'лаковая миниатюра',x:.78,y:.34,color:'#863e44',glyph:'bird'},
 {label:'Волга',town:'Тверь',detail:'город на Волге',x:.14,y:.43,color:'#235875',glyph:'water'},
 {label:'Майолика',town:'Ярославль',detail:'роспись по керамике',x:.50,y:.18,color:'#305b45',glyph:'bowl'},
 {label:'Матрёшка',town:'Сергиев Посад',detail:'деревянная расписная игрушка',x:.38,y:.74,color:'#935936',glyph:'doll'}];
const selected=[];let scanned=false, started=0, raf=0;
const canvas=document.getElementById('atlas'), ctx=canvas.getContext('2d'), marks=document.getElementById('marks');
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
function path(c,points){c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke()}
function glyph(c,type){
 c.lineWidth=1.7;c.lineCap='round';c.lineJoin='round';c.beginPath();
 if(type==='crystal'){path(c,[[-13,-5],[-7,-12],[7,-12],[13,-5],[0,13],[-13,-5],[13,-5]]);path(c,[[-7,-12],[0,13],[7,-12]])}
 if(type==='water'){for(let j=-7;j<10;j+=7){c.beginPath();c.moveTo(-15,j);c.bezierCurveTo(-8,j-7,-5,j+7,2,j);c.bezierCurveTo(8,j-6,10,j+5,15,j);c.stroke()}}
 if(type==='bowl'){c.moveTo(-14,-5);c.quadraticCurveTo(0,20,14,-5);c.closePath();c.stroke();c.beginPath();c.ellipse(0,-5,14,3,0,0,7);c.stroke();path(c,[[-5,10],[5,10]])}
 if(type==='bird'){c.moveTo(-14,8);c.quadraticCurveTo(-8,5,-11,-6);c.quadraticCurveTo(0,1,4,-8);c.quadraticCurveTo(9,-15,12,-7);c.lineTo(15,-6);c.lineTo(11,-4);c.quadraticCurveTo(8,9,-5,8);c.closePath();c.stroke();path(c,[[-8,5],[4,0]])}
 if(type==='doll'){c.moveTo(-8,-3);c.bezierCurveTo(-14,-18,14,-18,8,-3);c.bezierCurveTo(23,17,-23,17,-8,-3);c.stroke();c.beginPath();c.arc(0,-7,3.5,0,7);c.stroke();path(c,[[-6,5],[0,1],[6,5]])}
}
function stamp(id){
 const c=document.createElement('canvas');c.width=c.height=140;const p=places[id],g=c.getContext('2d');
 g.scale(2,2);g.translate(35,35);g.rotate((id%3-1)*.09);g.strokeStyle=g.fillStyle=p.color;
 for(const r of [30,27]){g.beginPath();g.lineWidth=r===30?2:.8;g.arc(0,0,r,0,Math.PI*2);g.stroke()}
 for(let i=0;i<26;i++){const a=i*Math.PI/13;g.beginPath();g.arc(24*Math.cos(a),24*Math.sin(a),.75,0,7);g.fill()}
 glyph(g,p.glyph);return c;
}
function sync(pop=false){
 const controls=[...document.querySelectorAll('.chip')];
 controls.forEach((b,i)=>{b.setAttribute('aria-pressed',String(selected.includes(i)));b.disabled=scanned||(!selected.includes(i)&&selected.length>=3)});
 marks.replaceChildren();
 for(let i=0;i<3;i++){const m=document.createElement('div'),id=selected[i];m.className='mark'+(id!==undefined?' full':'')+(pop&&i===selected.length-1?' pop':'');
 if(id!==undefined){m.append(stamp(id));m.setAttribute('role','img');m.setAttribute('aria-label',places[id].label)}else{m.textContent='·';m.setAttribute('aria-hidden','true')}marks.append(m)}
 document.getElementById('counter').textContent=scanned?'Билет прочитан. Три остановки на карте.':'Штампов в билете: '+selected.length+' из 3';
 document.getElementById('scan').disabled=selected.length!==3||scanned;document.getElementById('reset').hidden=!selected.length;
 draw(performance.now());
}
places.forEach((p,i)=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=p.label;b.addEventListener('click',()=>{const at=selected.indexOf(i);if(at>=0)selected.splice(at,1);else if(selected.length<3)selected.push(i);sync(at<0)});document.getElementById('chips').append(b)});
const result=document.getElementById('result');
document.getElementById('scan').addEventListener('click',()=>{
 if(selected.length!==3||scanned)return;scanned=true;started=performance.now();
 const list=document.getElementById('stops');list.replaceChildren();
 for(const id of selected){const li=document.createElement('li'),b=document.createElement('b'),s=document.createElement('span');b.textContent=places[id].town;s.textContent=' — '+places[id].detail;li.append(b,s);list.append(li)}
 result.hidden=false;sync();result.focus({preventScroll:true});
});
document.getElementById('reset').addEventListener('click',()=>{cancelAnimationFrame(raf);scanned=false;selected.length=0;result.hidden=true;sync();document.querySelector('.chip').focus({preventScroll:true})});
function draw(now){
 cancelAnimationFrame(raf);
 const box=canvas.getBoundingClientRect();if(!box.width||!box.height)return;
 const w=box.width,h=box.height,dpr=Math.min(2,devicePixelRatio||1);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 const grad=ctx.createLinearGradient(0,0,w,h);grad.addColorStop(0,'#203d33');grad.addColorStop(.55,'#173d37');grad.addColorStop(1,'#122e30');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
 // Engraved relief and waterways give the schematic atlas a paper-map texture.
 ctx.lineWidth=.75;
 for(let i=-5;i<37;i++){ctx.beginPath();for(let j=0;j<=90;j++){const x=j*w/90;const y=i*h/29+Math.sin(j/9+i*.11)*h*.054+Math.sin(j/4.4+i*.31)*h*.015; j?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=i%5===0?'#537064':'#3c584e';ctx.globalAlpha=.46;ctx.stroke()}ctx.globalAlpha=1;
 for(let r=0;r<2;r++){ctx.strokeStyle=r?'#5d978b':'#588b83';ctx.lineWidth=r?1.5:3;ctx.globalAlpha=.7;ctx.beginPath();ctx.moveTo(-w*.05,h*(.52+r*.15));ctx.bezierCurveTo(w*.14,h*.0,w*.19,h*.86,w*.44,h*.47);ctx.bezierCurveTo(w*.62,h*.12,w*.70,h*.65,w*1.05,h*.42);ctx.stroke()}ctx.globalAlpha=1;
 const prog=scanned?(reduce.matches?1:Math.min(1,(now-started)/1600)):0;
 if(scanned){const coords=selected.map(i=>[places[i].x*w,places[i].y*h]);const lineProg=prog*2;for(let i=0;i<2;i++){const part=Math.min(1,Math.max(0,lineProg-i));if(!part)continue;let [x,y]=coords[i],[x1,y1]=coords[i+1],t=[x+(x1-x)*part,y+(y1-y)*part];ctx.shadowColor='#ffd063';ctx.shadowBlur=12;ctx.lineWidth=3.5;ctx.strokeStyle='#f7cf69';path(ctx,[[x,y],t]);ctx.shadowBlur=0;ctx.fillStyle='#fff5b7';ctx.beginPath();ctx.arc(...t,3.8,0,7);ctx.fill()}}
 places.forEach((p,i)=>{const x=p.x*w,y=p.y*h,active=selected.includes(i);if(active){const rg=ctx.createRadialGradient(x,y,0,x,y,30);rg.addColorStop(0,'#e9c46485');rg.addColorStop(1,'#e9c46400');ctx.fillStyle=rg;ctx.fillRect(x-30,y-30,60,60)}
 ctx.beginPath();ctx.fillStyle=active?'#edcb79':'#789887';ctx.arc(x,y,active?5.5:3.4,0,7);ctx.fill();ctx.strokeStyle=active?'#f5d281':'#94ab97';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,active?10:7,0,7);ctx.stroke();
 ctx.textAlign='center';ctx.textBaseline='top';ctx.font=(active?'bold ':'')+(w<430?11.5:14)+'px Arial';ctx.lineWidth=3.5;ctx.strokeStyle='#244338';ctx.strokeText(p.town,x,y+13);ctx.fillStyle=active?'#fff0bf':'#d3ddc8';ctx.fillText(p.town,x,y+13)});
 if(scanned&&prog<1)raf=requestAnimationFrame(draw);
}
new ResizeObserver(()=>draw(performance.now())).observe(canvas.parentElement);sync();
</script></body></html>
