<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Билет путешественника · Золотое кольцо</title>
<style>
:root{color-scheme:light;--ivory:#fbf6e9;--ink:#283a30;--line:#bcb393;--moss:#284939;--accent:#a74c35}
*{box-sizing:border-box}
body{margin:0;background:#eee8d8;color:var(--ink);font:16px/1.45 Arial,sans-serif}
main{width:min(1200px,100%);padding:clamp(12px,2.5vw,30px);margin:auto}
h1,h2,h3,p,figure{margin:0}
h1,h2,h3{font-family:Georgia,serif;font-weight:400}
h1{font-size:clamp(31px,4.2vw,52px);line-height:1.08;letter-spacing:-.035em}
header p{margin:6px 0 15px;color:#4a5748}
.exhibit{overflow:hidden;border:1px solid #aa9c78;border-radius:8px;box-shadow:0 10px 30px #463a2420;background:var(--ivory)}
.map{position:relative;background:#ddd9b9;height:clamp(255px,34vw,365px);overflow:hidden;border-bottom:4px double #8f8060}
.map canvas{display:block;width:100%;height:100%}
.map-key{position:absolute;top:9px;left:10px;border:1px solid #afa285;background:#fbf5e5ed;color:#3c5144;padding:2px 9px;font:italic 13px Georgia,serif}
.ticket{display:grid;grid-template-columns:1.05fr 1fr;background:repeating-linear-gradient(0deg,transparent 0 3px,#866d4508 3px 4px),var(--ivory)}
.controls,.pass{padding:clamp(14px,2vw,23px)}
.pass{border-left:1px dashed #a89b7f;background:linear-gradient(110deg,#eee5d013, #efe5ca6b);position:relative}
.pass:before,.pass:after{content:'';position:absolute;left:-8px;width:15px;height:15px;border-radius:50%;background:#eee8d8}
.pass:before{top:-8px}.pass:after{bottom:-8px}
h2{font-size:clamp(20px,2.6vw,27px);line-height:1.13}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
button{font:inherit;cursor:pointer}.chip{display:inline-flex;align-items:center;gap:7px;min-height:43px;padding:6px 12px 6px 6px;border:1px solid #b8aa88;border-radius:4px;background:#fffbef;color:#2d3a2d;font-size:14px}
.chip img{width:29px;height:29px;object-fit:contain;mix-blend-mode:multiply}
.chip[aria-pressed=true]{border-color:#344b39;box-shadow:inset 0 -3px #36523d;background:#e9eedc}
.chip:disabled:not([aria-pressed=true]){opacity:.59}
button:focus-visible{outline:3px solid #9b532e;outline-offset:3px}
.marks{display:flex;align-items:center;gap:8px;min-height:63px;margin:8px 0}
.mark{display:grid;place-items:center;width:clamp(53px,6vw,75px);aspect-ratio:1;border:1px dashed #b4a787;border-radius:50%;font:italic 14px Georgia,serif;color:#857b62}
.mark canvas{height:100%;width:100%}.mark.full{border-color:transparent}
.mark.pop{animation:press .32s ease-out}@keyframes press{0%{transform:translateY(-6px) scale(1.3);opacity:0}68%{transform:scale(.9)}100%{transform:none;opacity:1}}
.counter{font-size:14px;color:#58604e;margin-top:9px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{padding:8px 15px;min-height:44px;border-radius:4px;font-weight:600;font-size:14px}
.go{border:1px solid var(--moss);background:var(--moss);color:white}.go:disabled{border-color:#bcb297;background:#dfd6c3;color:#665f50;cursor:default}.reset{background:transparent;color:var(--moss);border:1px solid var(--line)}
.result{padding:18px 0 0}.result[hidden]{display:none}.result ol{padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 0}
.result li{background:#fffaf0;border:1px solid var(--line);padding:9px;display:grid;grid-template-columns:62px 1fr;gap:9px;align-items:center}
.result li img{width:100%;mix-blend-mode:multiply}.result b,.result small{display:block}.result b{font:19px Georgia,serif}.result small{color:#58614f}
@media(max-width:650px){.ticket{grid-template-columns:1fr}.pass{border-left:0;border-top:1px dashed var(--line);display:grid;grid-template-columns:1fr auto;align-items:center;gap:5px 10px}.pass:before,.pass:after{display:none}.marks{min-height:44px;gap:2px;margin:0;grid-row:2}.mark{width:43px}.actions{grid-column:2;grid-row:1/3;flex-direction:column;gap:4px}.actions button{font-size:13px;padding:6px 9px}.controls,.pass{padding:12px}.chip{min-height:40px;font-size:13px;padding-right:8px}.chips{gap:5px}.chip img{width:24px;height:24px}.map{height:248px}.map-key{font-size:11px}.result ol{grid-template-columns:1fr}.result li{grid-template-columns:50px 1fr;padding:5px 8px}.result h2 span{display:block}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main>
<header><h1>Билет путешественника</h1><p>Выберите три впечатления и отсканируйте билет. Порядок штампов задаёт путь по карте.</p></header>
<div class="exhibit">
  <div class="map"><canvas id="atlas" aria-hidden="true"></canvas><span class="map-key">Схема маршрута</span></div>
  <div class="ticket">
    <section class="controls"><h2>Что вам запомнилось?</h2><div class="chips" id="chips"></div><p class="counter" id="counter" aria-live="polite"></p></section>
    <section class="pass"><h2>Ваш билет</h2><div class="marks" id="marks" aria-label="Собранные штампы"></div><div class="actions"><button class="go" id="scan" disabled>Сканировать билет</button><button class="reset" id="reset" hidden>Новый билет</button></div></section>
  </div>
</div>
<section id="result" class="result" hidden tabindex="-1"><h2>Ваш маршрут</h2><ol id="stops"></ol></section>

const places = [

  {label:'Миниатюра', town:'Палех', detail:'Лаковая миниатюра', x:.775, y:.23, ink:'#8d3542'},

];
const canvas=document.getElementById('atlas');
const ctx=canvas.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const selected=[];
let scanned=false, started=0, animation=0;
const images=plateSources.map(src=>{const image=new Image();image.src=src;return image});
const landscape=new Image();
landscape.src=atlasSource;
const $=id=>document.getElementById(id);

function stamp(index,order){
  const mark=document.createElement('canvas');
  mark.width=mark.height=170;
  const pen=mark.getContext('2d'),place=places[index];
  pen.translate(85,85);pen.rotate((index%3-1)*.065);
  pen.strokeStyle=pen.fillStyle=place.ink;
  for(const r of [76,70,61]){pen.lineWidth=r===76?3:1;pen.beginPath();pen.arc(0,0,r,0,2*Math.PI);pen.stroke()}
  for(let i=0;i<42;i++){
    const angle=Math.PI*i/21;
    pen.fillRect(65*Math.cos(angle),65*Math.sin(angle),2,2);
  }
  if(images[index].naturalWidth){pen.save();pen.globalCompositeOperation='multiply';pen.drawImage(images[index],-42,-43,84,84);pen.restore()}
  pen.beginPath();pen.arc(46,46,17,0,2*Math.PI);pen.fill();
  pen.fillStyle='#fff8df';pen.textAlign='center';pen.font='bold 22px Georgia';pen.fillText(order,46,54);
  return mark;
}

function choose(index){
  if(scanned)return;
  const existing=selected.indexOf(index);
  if(existing>=0)selected.splice(existing,1);
  else if(selected.length<3)selected.push(index);
  else return;
  sync(existing<0);
}
function sync(pop=false){
  document.querySelectorAll('.chip').forEach((button,i)=>{
    button.setAttribute('aria-pressed',String(selected.includes(i)));
    button.disabled=scanned||(selected.length===3&&!selected.includes(i));
  });
  $('marks').replaceChildren(...Array.from({length:3},(_,i)=>{
    const mark=document.createElement('span');
    mark.className='mark';
    if(i<selected.length){
      mark.classList.add('full');
      if(pop&&i===selected.length-1)mark.classList.add('pop');
      mark.append(stamp(selected[i],i+1));
      mark.setAttribute('role','img');mark.setAttribute('aria-label',(i+1)+'. '+places[selected[i]].label);
    }else{mark.textContent='·';mark.setAttribute('aria-hidden','true')}
    return mark;
  }));
  $('counter').textContent=scanned?'Три остановки связаны в маршрут.':'Штампов в билете: '+selected.length+' из 3';
  $('scan').disabled=selected.length!==3||scanned;
  $('reset').hidden=!selected.length;
  draw(performance.now());
}

places.forEach((place,i)=>{
  const button=document.createElement('button'), icon=new Image();
  button.className='chip';button.type='button';icon.src=plateSources[i];icon.alt='';
  button.append(icon,place.label);button.addEventListener('click',()=>choose(i));$('chips').append(button);
});
$('scan').addEventListener('click',()=>{
  if(selected.length!==3||scanned)return;
  scanned=true;started=performance.now();
  $('stops').replaceChildren(...selected.map((id,order)=>{
    const card=document.createElement('li'),text=document.createElement('span'),name=document.createElement('b'),detail=document.createElement('small'),pic=new Image();
    pic.src=plateSources[id];pic.alt='';name.textContent=(order+1)+'. '+places[id].town;detail.textContent=places[id].detail;
    text.append(name,detail);card.append(pic,text);return card;
  }));
  $('result').hidden=false;sync();$('result').focus({preventScroll:true});
});
$('reset').addEventListener('click',()=>{
  scanned=false;selected.length=0;$('result').hidden=true;sync();document.querySelector('.chip').focus({preventScroll:true});
});

function pathPoint(start,end,t,leg){
  const dx=end.x-start.x,dy=end.y-start.y;
  const bend=(leg===0?1:-1)*.17;
  const cx=(start.x+end.x)*.5-dy*bend,cy=(start.y+end.y)*.5+dx*bend;
  const u=1-t;
  return {x:u*u*start.x+2*u*t*cx+t*t*end.x,y:u*u*start.y+2*u*t*cy+t*t*end.y};
}

function traceRoute(nodes,progress){
  ctx.lineCap='round';ctx.lineJoin='round';
  for(let leg=0;leg<2;leg++){
    const t=Math.max(0,Math.min(1,progress*2-leg));
    if(t===0)continue;
    const start=nodes[leg],end=nodes[leg+1],steps=45;
    ctx.beginPath();ctx.moveTo(start.x,start.y);
    for(let n=1;n<=steps;n++){const p=pathPoint(start,end,t*n/steps,leg);ctx.lineTo(p.x,p.y)}
    ctx.lineWidth=7;ctx.strokeStyle='#fff4cb';ctx.stroke();
    ctx.lineWidth=3.7;ctx.strokeStyle='#a1402c';ctx.stroke();
    if(t<1){const p=pathPoint(start,end,t,leg);ctx.fillStyle='#5c392e';ctx.beginPath();ctx.arc(p.x,p.y,6,0,2*Math.PI);ctx.fill()}
  }
}

function drawStop(place,index,w,h,progress){
  const x=place.x*w,y=place.y*h,small=w<540,r=small?17:24,number=selected.indexOf(index)+1;
  ctx.save();
  ctx.shadowColor='#4f402a66';ctx.shadowBlur=4;ctx.shadowOffsetY=2;
  ctx.fillStyle='#fbf1d5';ctx.strokeStyle=number?place.ink:'#817854';ctx.lineWidth=number?2.8:1.2;
  ctx.beginPath();ctx.arc(x,y,r+2,0,2*Math.PI);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  if(images[index].naturalWidth){
    ctx.save();ctx.beginPath();ctx.arc(x,y,r-1,0,2*Math.PI);ctx.clip();ctx.globalCompositeOperation='multiply';
    ctx.drawImage(images[index],x-r,y-r,2*r,2*r);ctx.restore();
  }
  if(number){
    const bx=x+r*.82,by=y-r*.8;
    ctx.fillStyle=place.ink;ctx.beginPath();ctx.arc(bx,by,small?8:10,0,Math.PI*2);ctx.fill();
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='white';ctx.font='bold '+(small?10:12)+'px Arial';ctx.fillText(number,bx,by+.5);
  }
  const font=small?11:15;
  ctx.font=(number?'bold ':'')+font+'px Georgia';ctx.textAlign='center';ctx.textBaseline='middle';
  const tw=ctx.measureText(place.town).width+12,ly=y+r+11,lx=Math.max(tw/2+4,Math.min(w-tw/2-4,x));
  ctx.fillStyle=number?'#284536':'#faf3daee';ctx.fillRect(lx-tw/2,ly-font*.69,tw,font*1.48);
  ctx.fillStyle=number?'#fff3cd':'#324535';ctx.fillText(place.town,lx,ly+.6);
  ctx.restore();
}

function draw(now){
  cancelAnimationFrame(animation);
  const rect=canvas.getBoundingClientRect(),w=rect.width,h=rect.height;
  if(!w||!h)return;
  const dpr=Math.min(devicePixelRatio||1,2);
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#e1ddbe';ctx.fillRect(0,0,w,h);
  if(landscape.naturalWidth){
    const scale=Math.max(w/landscape.width,h/landscape.height);
    ctx.drawImage(landscape,(w-landscape.width*scale)/2,(h-landscape.height*scale)/2,landscape.width*scale,landscape.height*scale);
  }
  ctx.strokeStyle='#635f4155';ctx.lineWidth=1;
  ctx.strokeRect(5.5,5.5,w-11,h-11);
  const progress=scanned?(reduce.matches?1:Math.min(1,Math.max(0,(now-started)/1750))):0;
  if(scanned)traceRoute(selected.map(i=>({x:places[i].x*w,y:places[i].y*h})),progress);
  places.forEach((place,i)=>drawStop(place,i,w,h,progress));
  if(scanned&&progress<1)animation=requestAnimationFrame(draw);
}

new ResizeObserver(()=>draw(performance.now())).observe(canvas.parentElement);
for(const image of [landscape,...images])image.addEventListener('load',()=>sync());
reduce.addEventListener('change',()=>draw(performance.now()));
sync();
</script></body></html>
