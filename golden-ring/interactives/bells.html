<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Голоса колоколов</title><link rel="stylesheet" href="apparatus.css"><style>.belfry iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#1b2525}.spectator header,.spectator h1,.spectator main>p,.spectator #exhibit-controls,.spectator .open-screen{display:none}.spectator main{width:100%;max-width:none;margin:0;padding:0}.spectator iframe{width:100vw;height:100dvh}</style></head><body><header><a href="../#interactives">← Интерактивы</a><a href="apparatus.html?scene=bells">Звонница в 3D →</a></header><main><h1>Голоса колоколов</h1><p>Выберите своё место. Соседи могут вступить и выйти из перезвона в любой момент.</p><div class="belfry"><iframe src="apparatus.html?scene=bells&amp;film=1" title="Три колокола и площадки слушателей"></iframe></div><a class="open-screen" href="?screen=1" target="_blank" rel="noopener">Открыть отдельный экран зрителей ↗</a><p id="feedback" aria-live="polite">Выберите свой колокол.</p><div id="exhibit-controls"></div></main><script type="module">
import {bellConsole} from './bell-console.js';
const only=new URLSearchParams(location.search).has('screen');document.body.classList.toggle('spectator',only);
const frame=document.querySelector('iframe'),channel='BroadcastChannel' in window?new BroadcastChannel('ring-bells-v2'):null;
let last={voices:[0,0,0],participants:[false,false,false]};
function display(state){last=state;frame.contentWindow.apparatus?.showBells?.(state);}
frame.addEventListener('load',async()=>{await frame.contentWindow.apparatus?.ready;display(last);if(only)channel?.postMessage({request:true});});
if(only&&channel)channel.onmessage=e=>{if(e.data.participants)display(e.data);};
if(!only){if(channel)channel.onmessage=e=>{if(e.data.request)channel.postMessage(last);};bellConsole(document.querySelector('#exhibit-controls'),state=>{display(state);channel?.postMessage(state);},document.querySelector('#feedback'));}
</script></body></html>
