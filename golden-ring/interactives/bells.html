<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow"><title>Голоса колоколов · Золотое кольцо</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#141c20;color:#fbefd8;font:16px/1.5 Arial,sans-serif}
    main{width:min(1080px,100%);margin:auto;padding:clamp(15px,3vw,34px)}
    .head,.actions{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
    h1{font:400 clamp(32px,4vw,58px)/1.05 Georgia,serif;margin:0}
    p{margin:8px 0 15px;color:#c8cdca}button,a{font:inherit;color:inherit}
    button{border:1px solid #7e837c;padding:10px 15px;min-height:44px;cursor:pointer;background:#253035;border-radius:5px}
    button:hover,button[aria-pressed=true]{background:#43504e}
    button:focus-visible,a:focus-visible{outline:3px solid #ffe2a4;outline-offset:3px}
    .sound{font-size:14px}.stage{position:relative;border-radius:8px;background:#182b34;overflow:hidden;isolation:isolate;box-shadow:0 0 0 1px #53636a}
    canvas{display:block;width:100%;height:clamp(230px,43vh,400px)}
    .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}
    .keys button{border-bottom:2px solid var(--voice,#a78e5c);font-size:clamp(14px,1.8vw,19px);font-family:Georgia,serif;border-color:#5a6869}
    .keys button[aria-pressed=true]{color:#ffe3ae;border-color:#d5ac65;background:#343938}
    .feedback{min-height:1.7em;font-weight:bold;color:#f6d294;margin:10px 0}
    .actions{border-top:1px solid #424b4b;margin-top:13px;padding-top:12px}.actions a{color:#dfd3af;text-underline-offset:4px}
    .audience main{max-width:none;padding:0}.audience .head,.audience .actions,.audience .instruction,.audience .keys{display:none}
    .audience .stage{border:0;border-radius:0}.audience canvas{height:100dvh}.audience .feedback{position:fixed;bottom:3vh;text-align:center;width:100%;text-shadow:0 2px 9px #000}
    @media(max-width:520px){.keys button{padding:8px 4px}.keys{gap:5px}.head{gap:8px}.sound{padding:6px 10px}.actions{font-size:14px}.feedback{font-size:14px}}
  </style>
</head>
<body><main>
  <div class="head"><h1>Голоса колоколов</h1><button class="sound" id="sound" aria-pressed="false">Включить звук</button></div>
  <p class="instruction">Ударьте по каждому колоколу, чтобы собрать общий перезвон. Следите за языками и отражением огней на воде.</p>
  <div class="stage"><canvas aria-label="Три литых колокола над рекой. Удар качает язык и зажигает огни города на дальнем берегу"></canvas></div>
  <div class="keys" aria-label="Колокола"><button style="--voice:#d8a16b" data-bell="0" aria-pressed="false">1 · Большой</button><button style="--voice:#d4bd82" data-bell="1" aria-pressed="false">2 · Средний</button><button style="--voice:#9cbbc1" data-bell="2" aria-pressed="false">3 · Малый</button></div>
  <p id="feedback" class="feedback" role="status">Выберите первый колокол.</p>
  <div class="actions"><button id="reset">Начать заново</button><a id="audience" target="_blank" rel="noopener">Открыть экран зрителей ↗</a></div>
</main>
<script>
  'use strict';
  const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
  const motion=matchMedia('(prefers-reduced-motion: reduce)');
  const names=['Большой','Средний','Малый'], pitches=[146.83,220,293.66];
  const params=new URLSearchParams(location.search);
  const spectator=params.has('screen'), session=params.get('screen')||Math.random().toString(36).slice(2);
  const channel='BroadcastChannel' in window ? new BroadcastChannel('ring-bells-'+session) : null;
  document.body.classList.toggle('audience',spectator);
  const link=document.querySelector('#audience');
  link.href=location.pathname+'?screen='+encodeURIComponent(session);
  if(!channel)link.hidden=true;
  let selected=[false,false,false], hits=[-1e5,-1e5,-1e5], finalAt=-1e5, last=-1;
  let width,height,soundEnabled=false,audio,frame,timers=[];
  const status=document.querySelector('#feedback');
  function count(){return selected.filter(Boolean).length}
  function announce(){
    const n=count();
    status.textContent=n===3?'Общая звонница · три голоса разбудили город':n?names[last]+' колокол · голосов '+n+' из 3':spectator?'Звонница ждёт участников':'Выберите первый колокол.';
    document.querySelectorAll('[data-bell]').forEach((b,i)=>b.setAttribute('aria-pressed',String(selected[i])));
  }
  function ring(note,delay=0){
    if(!audio||!soundEnabled)return;
    const now=audio.currentTime+delay;
    for(const [factor,level,decay] of [[1,.12,1.9],[2.40,.035,1.1],[3.01,.032,1.5],[4.18,.02,.65]]){
      const osc=audio.createOscillator(),gain=audio.createGain();
      osc.frequency.value=pitches[note]*factor;gain.gain.setValueAtTime(.0001,now);
      gain.gain.exponentialRampToValueAtTime(level,now+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+decay);
      osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+decay+.02);
    }
  }
  function strike(note){
    if(spectator)return;
    const before=count(),now=performance.now();
    hits[note]=now;last=note;selected[note]=true;ring(note);
    if(before<3 && count()===3){
      finalAt=now;
      [0,2,1,2,0,1,2].forEach((n,i)=>{timers.push(setTimeout(()=>{hits[n]=performance.now();ring(n);drawLoop();send();},(i+1)*290))});
    }
    announce();send();drawLoop();
  }
  function send(){
    if(!channel||spectator)return;
    const now=performance.now();
    channel.postMessage({type:'state',selected,last,ages:hits.map(t=>now-t),endAge:now-finalAt});
  }
  if(channel){
    channel.onmessage=({data})=>{
      if(data.type==='hello'){send();return}
      if(!spectator||data.type!=='state')return;
      const now=performance.now();selected=data.selected;last=data.last;hits=data.ages.map(t=>now-t);finalAt=now-data.endAge;
      announce();drawLoop();
    };
    if(spectator)channel.postMessage({type:'hello'});
  }
  function reset(){
    timers.forEach(clearTimeout);timers=[];selected=[false,false,false];hits=[-1e5,-1e5,-1e5];finalAt=-1e5;last=-1;
    announce();send();drawLoop();
  }
  document.querySelector('#sound').onclick=async e=>{
    try{
      audio=audio||new AudioContext();await audio.resume();soundEnabled=!soundEnabled;
      e.target.textContent=soundEnabled?'Выключить звук':'Включить звук';
      e.target.setAttribute('aria-pressed',String(soundEnabled));if(soundEnabled)ring(last<0?1:last);
    }catch{status.textContent='Звук недоступен в этом браузере. Выберите колокол, чтобы увидеть его голос.'}
  };
  document.querySelector('#reset').onclick=reset;
  document.querySelectorAll('[data-bell]').forEach(b=>b.onclick=()=>strike(Number(b.dataset.bell)));
  document.addEventListener('keydown',e=>{if(!e.repeat&&['1','2','3'].includes(e.key))strike(Number(e.key)-1)});
  canvas.addEventListener('pointerdown',e=>{
    const box=canvas.getBoundingClientRect();const y=(e.clientY-box.top)/box.height;
    if(y>.8)return;strike(Math.max(0,Math.min(2,Math.floor(3*(e.clientX-box.left)/box.width))));
  });
  const bellArt = ['great', 'middle', 'treble'].map(name => loadArt('bells-' + name));
  const quietCity = loadArt('bells-riverside-dusk');
  const brightCity = loadArt('bells-riverside');
  const voices = [
    { size: 1, y: .058, decay: 1680, period: 960, wave: 2, colour: '255,185,110' },
    { size: .81, y: .085, decay: 1260, period: 660, wave: 3, colour: '255,224,159' },
    { size: .65, y: .109, decay: 900, period: 460, wave: 4, colour: '188,232,239' }
  ];

  function loadArt(name) {
    const img = new Image();
    img.addEventListener('load', () => { if (width && height) drawLoop(); });
    img.src = 'art/' + name + '.webp';
    return img;
  }

  function ready(img) { return img.complete && img.naturalWidth > 0; }

  function landscape(img) {
    const scale = Math.max(width / img.width, height / img.height);
    const w = img.width * scale, h = img.height * scale;
    ctx.drawImage(img, (width-w)/2, (height-h)*.65, w, h);
  }

  function roofBeam() {
    const h = Math.min(19, height * .052);
    const beam = ctx.createLinearGradient(0,0,0,h);
    beam.addColorStop(0,'#302920'); beam.addColorStop(.48,'#29231d'); beam.addColorStop(.72,'#3d3023'); beam.addColorStop(1,'#181913');
    ctx.fillStyle = beam; ctx.fillRect(0,0,width,h);
    ctx.fillStyle = '#8d73514d'; ctx.fillRect(0,h-1,width,1);
    const shade = ctx.createLinearGradient(0,h,0,h+48);
    shade.addColorStop(0,'#10131a65'); shade.addColorStop(1,'#10131a00');
    ctx.fillStyle = shade; ctx.fillRect(0,h,width,48);
  }

  function drawClapper(bw,bh,swing) {
    // The hinge is inside the casting. Only the bottom of the shaft and its striking ball emerge from the mouth.
    ctx.save(); ctx.translate(0,bh*.56);ctx.rotate(swing);
    const base = bh*.404, strikeLength = bh*.493, r = bw*.047;
    const metal = ctx.createLinearGradient(-r,0,r,0);
    metal.addColorStop(0,'#332c29'); metal.addColorStop(.3,'#a69b7f'); metal.addColorStop(.49,'#827963'); metal.addColorStop(1,'#332f29');
    ctx.fillStyle=metal; ctx.fillRect(-r*.38,base,r*.76,strikeLength-base);
    const patina = ctx.createRadialGradient(-r*.35,strikeLength-r*.65,0,0,strikeLength,r*1.25);
    patina.addColorStop(0,'#c8b698');patina.addColorStop(.34,'#8c7961');patina.addColorStop(.75,'#594a3b');patina.addColorStop(1,'#2f2a26');
    ctx.fillStyle=patina;ctx.beginPath();ctx.ellipse(0,strikeLength,r*.94,r*1.22,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#524334';ctx.fillRect(-r*.29,strikeLength+r*.86,r*.58,r*.63);
    ctx.restore();
  }

  function soundingBell(index, time) {
    const art = bellArt[index], voice = voices[index];
    if (!ready(art)) return;
    const q = Math.min(width*.29/art.width, height*.59/art.height) * voice.size;
    const bw = art.width*q, bh = art.height*q;
    const x=width*(index+.5)/3, y=height*voice.y+7;
    const age = Math.max(0,time-hits[index]), env = Math.exp(-age / voice.decay);
    const swing = motion.matches ? 0 : Math.cos(age/voice.period*Math.PI*4) * env;
    // Independent dynamics: the mouth recoils slightly, the clapper swings further and reverses twice as fast.
    ctx.save();ctx.translate(x,y);ctx.rotate(swing*.022);
    const chain = ctx.createLinearGradient(-bw*.012,0,bw*.012,0);
    chain.addColorStop(0,'#242628');chain.addColorStop(.48,'#ac9c7b');chain.addColorStop(.95,'#36332c');
    ctx.fillStyle=chain;ctx.fillRect(-bw*.009,-y,bw*.018,y+bh*.045);
    ctx.drawImage(art,-bw*.5,0,bw,bh);
    drawClapper(bw,bh,swing*.29);
    ctx.restore();

    if (selected[index]) {
      // Broad, slow amber arcs for bass; clustered quick silver arcs for treble.
      const elapsed = motion.matches ? 340 : age;
      const life = Math.exp(-elapsed / voice.decay), end = y+bh*1.05;
      const arcs = voice.wave;
      ctx.save();
      for (let k=0;k<arcs;k++) {
        const phase = (elapsed/voice.period + k/arcs)%1;
        const radius = bw*(.34+phase*(.54+.12*index));
        ctx.strokeStyle='rgba('+voice.colour+','+((1-phase)*life*.66)+')';
        ctx.lineWidth = Math.max(1.1,bw*.014)*(1-phase*.4);
        ctx.beginPath();ctx.ellipse(x,end+bh*(.018+phase*.18),radius,Math.max(4,radius*.10),0,0,Math.PI);ctx.stroke();
      }
      ctx.restore();
    }
  }

  function draw(time) {
    if (!width || !height) return;
    ctx.fillStyle='#17252e';ctx.fillRect(0,0,width,height);
    if (ready(quietCity)) landscape(quietCity);
    const dawn=count()===3 ? motion.matches ? 1 : Math.min(1,(time-finalAt)/2000) : 0;
    if (ready(brightCity)) {
      // Progressive illumination of the quay below each participating voice.
      selected.forEach((on,i)=>{
        if(!on||dawn>=1)return;
        const radius=width*.24, x=width*(i+.5)/3;
        ctx.save();ctx.beginPath();ctx.ellipse(x,height*.78,radius,height*.2,0,0,Math.PI*2);ctx.clip();ctx.globalAlpha=.32*(1-dawn);landscape(brightCity);ctx.restore();
      });
      if(dawn){ctx.save();ctx.globalAlpha=dawn;landscape(brightCity);ctx.restore();}
    }
    const sides=ctx.createLinearGradient(0,0,width,0);
    sides.addColorStop(0,'#10121935');sides.addColorStop(.22,'#10121900');sides.addColorStop(.78,'#10121900');sides.addColorStop(1,'#10121936');
    ctx.fillStyle=sides;ctx.fillRect(0,0,width,height);
    roofBeam();
    for(let i=0;i<3;i++)soundingBell(i,time);
  }

  function drawLoop(){
    cancelAnimationFrame(frame);
    function tick(now){draw(now);if(!motion.matches&&now-Math.max(...hits,finalAt)<5400)frame=requestAnimationFrame(tick)}
    frame=requestAnimationFrame(tick);
  }
  new ResizeObserver(()=>{
    const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio,2);
    width=rect.width;height=rect.height;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);drawLoop();
  }).observe(canvas);
  announce();
</script></body></html>
