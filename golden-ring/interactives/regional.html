<p class="caption">Тверская зона. Три художественных вида показывают ход реки от истока к слиянию русел.</p>

const count=document.getElementById('count'),room=document.getElementById('room'),reset=document.getElementById('reset');
const windows=[],reduce=matchMedia('(prefers-reduced-motion:reduce)');
function update(){
 const n=windows.filter(w=>w.open).length;
 count.textContent=n+' из 3';reset.disabled=!windows.some(w=>w.open||w.strokes.length);
 room.classList.toggle('complete',n===3);
 document.getElementById('progress').textContent=n===3?'Панорама открыта':'Открыто окон';
 document.getElementById('finale').textContent=n===3?'· Волга от истока до Стрелки':'';
}
function rng(seed){return()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}}
function drawFog(w){
 const rect=w.button.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
 if(rect.width<2||rect.height<2)return;
 const fog=w.canvas,width=Math.max(2,Math.round(rect.width)),height=Math.max(2,Math.round(rect.height));
 w.width=width;w.height=height;fog.width=Math.round(width*dpr);fog.height=Math.round(height*dpr);
 const c=w.ctx;c.setTransform(dpr,0,0,dpr,0,0);c.globalCompositeOperation='source-over';
 const base=c.createLinearGradient(0,0,width,height);base.addColorStop(0,'rgba(197,209,193,.97)');base.addColorStop(.56,'rgba(171,194,181,.94)');base.addColorStop(1,'rgba(111,146,144,.93)');c.fillStyle=base;c.fillRect(0,0,width,height);
 const rand=rng(1253+w.index*37);
 for(let i=0;i<1250;i++){
   const x=rand()*width,y=rand()*height,r=.15+Math.pow(rand(),3)*1.75;
   c.beginPath();c.ellipse(x,y,r*.78,r*1.45,-.12,0,7);c.fillStyle='rgba(54,88,86,'+(.06+.09*rand())+')';c.fill();
   if(r>.85){c.beginPath();c.arc(x-.25*r,y-.52*r,r*.38,0,7);c.fillStyle='rgba(245,249,238,.6)';c.fill()}
 }
 for(let k=0;k<w.strokes.length;k++)dab(w,...w.strokes[k]);
}
function dab(w,x,y){
 const c=w.ctx,px=x*w.width,py=y*w.height,r=Math.max(18,Math.min(w.width,w.height)*.22);
 const g=c.createRadialGradient(px,py,r*.35,px,py,r);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.72,'rgba(0,0,0,.95)');g.addColorStop(1,'rgba(0,0,0,0)');c.globalCompositeOperation='destination-out';c.fillStyle=g;c.fillRect(px-r,py-r,r*2,r*2);c.globalCompositeOperation='source-over';
}
function unlock(w){if(w.open)return;w.open=true;w.button.classList.add('open','touched');w.button.setAttribute('aria-label',places[w.index].title+' — окно открыто');w.status.textContent=places[w.index].view;update()}
function stroke(w,x,y){
 if(w.open)return;
 w.strokes.push([x,y]);w.button.classList.add('touched');reset.disabled=false;dab(w,x,y);
 const rows=24,cols=16,radius=Math.max(18,Math.min(w.width,w.height)*.22)*.8;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
   const gx=(c+.5)/cols,gy=(r+.5)/rows;
   // Omit the two corners outside the arch from the coverage estimate.
   if(gy<.38&&Math.pow((gx-.5)/.5,2)+Math.pow((gy-.38)/.38,2)>1)continue;
   if(Math.hypot((gx-x)*w.width,(gy-y)*w.height)<radius)w.cleared.add(r*cols+c);
 }
 if(w.cleared.size>=Math.floor(rows*cols*.30))unlock(w);
}
function pos(w,event){const r=w.button.getBoundingClientRect();return [Math.max(0,Math.min(1,(event.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(event.clientY-r.top)/r.height))]}
function autoWipe(w){
 if(w.open||w.playing)return;
 w.playing=true;w.button.classList.add('touched');reset.disabled=false;
 const start=performance.now(),duration=reduce.matches?0:540;
 const animate=(t)=>{const p=duration?Math.min(1,(t-start)/duration):1;
   while(w.step<=Math.floor(34*p)){const n=w.step/34;stroke(w,.17+n*.66,.61-Math.sin(n*Math.PI)*.3);w.step++}
   if(p<1&&!w.open)w.frame=requestAnimationFrame(animate);else{w.playing=false;unlock(w)}
 };w.frame=requestAnimationFrame(animate);
}
places.forEach((p,i)=>{
 const div=document.createElement('div');div.className='portal';
 const button=document.createElement('button');button.type='button';button.className='arch';button.setAttribute('aria-label','Открыть окно «'+p.title+'»');
 const img=document.createElement('img');img.className='land';img.src=p.image;img.alt='';img.draggable=false;
 const canvas=document.createElement('canvas');canvas.className='fog';canvas.setAttribute('aria-hidden','true');
 const marker=document.createElement('span');marker.className='mist-mark';marker.setAttribute('aria-hidden','true');marker.innerHTML='<span>≈</span>';
 const shine=document.createElement('span');shine.className='gleam';button.append(img,canvas,marker,shine);
 const label=document.createElement('div');label.className='label';const name=document.createElement('b'),status=document.createElement('small');name.textContent=p.title;status.textContent='Стекло в тумане';label.append(name,status);
 div.append(button,label);document.getElementById('windows').append(div);
 const w={button,canvas,ctx:canvas.getContext('2d'),status,index:i,width:0,height:0,strokes:[],cleared:new Set(),open:false,playing:false,step:0,frame:0,down:null,dragged:false};
 windows.push(w);
 button.addEventListener('pointerdown',e=>{if(w.open||w.playing)return;w.down={x:e.clientX,y:e.clientY,id:e.pointerId,last:pos(w,e)};w.dragged=false;button.setPointerCapture(e.pointerId);stroke(w,...w.down.last)});
 button.addEventListener('pointermove',e=>{if(w.open||!w.down||w.down.id!==e.pointerId)return;
   if(Math.hypot(e.clientX-w.down.x,e.clientY-w.down.y)>5)w.dragged=true;
   const xy=pos(w,e),last=w.down.last,n=Math.max(1,Math.ceil(Math.hypot((xy[0]-last[0])*w.width,(xy[1]-last[1])*w.height)/9));
   for(let j=1;j<=n&&!w.open;j++)stroke(w,last[0]+(xy[0]-last[0])*j/n,last[1]+(xy[1]-last[1])*j/n);w.down.last=xy;
 });
 button.addEventListener('pointerup',()=>{w.down=null});
 button.addEventListener('pointercancel',()=>{w.down=null;w.dragged=false});
 button.addEventListener('click',e=>{if(!w.dragged||e.detail===0)autoWipe(w);w.dragged=false});
 new ResizeObserver(()=>{if(!w.open)drawFog(w)}).observe(button);
});
reset.addEventListener('click',()=>{for(const w of windows){cancelAnimationFrame(w.frame);w.open=w.playing=w.dragged=false;w.strokes=[];w.step=0;w.down=null;w.cleared.clear();w.status.textContent='Стекло в тумане';w.button.classList.remove('open','touched');w.button.setAttribute('aria-label','Открыть окно «'+places[w.index].title+'»');drawFog(w)}update();windows[0].button.focus({preventScroll:true})});
update();
</script></body></html>
